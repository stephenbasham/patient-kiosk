<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient kiosk</title>
<style>
  :root {
    --bg: #0b2a3a; --bg2: #103a4f; --card: #ffffff; --ink: #0b2a3a;
    --muted: #5b7482; --accent: #14a38b; --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: #fff; overflow: hidden; user-select: none;
  }
  .screen { display: none; height: 100vh; width: 100vw; padding: 4vh 5vw; }
  .screen.active { display: flex; flex-direction: column; }

  /* Welcome */
  #welcome { align-items: center; justify-content: center; text-align: center; cursor: pointer; }
  #welcome h1 { font-size: 7vh; font-weight: 600; margin: 0 0 2vh; }
  #welcome p { font-size: 3vh; color: #b9d3de; margin: 0 0 7vh; }
  .start {
    font-size: 3.4vh; font-weight: 600; padding: 2.6vh 6vw; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); border: 0;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { .start { animation: none; } }

  /* Menu */
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4vh; }
  header h2 { font-size: 4.4vh; font-weight: 600; margin: 0; }
  header .clock { font-size: 3vh; color: #b9d3de; }
  .tiles { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 3vh 2.5vw; }
  .tile {
    background: var(--card); color: var(--ink); border: 0; border-radius: 3vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2vh; font: inherit; cursor: pointer; padding: 2vh;
    transition: transform .12s ease;
  }
  .tile:active { transform: scale(.97); }
  .tile svg { width: 11vh; height: 11vh; stroke: var(--accent); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tile .name { font-size: 4vh; font-weight: 600; }
  .tile .hint { font-size: 2.3vh; color: var(--muted); }

  /* Shown underneath a site window; the whole screen is one big back button */
  #opened { padding: 0; cursor: pointer; background: var(--accent); color: var(--accent-ink);
    justify-content: space-between; align-items: center; text-align: center; }
  #opened .edge { width: 100%; padding: 1.6vh 0; font-size: 3vh; font-weight: 600; }
  #opened .middle { font-size: 6vh; font-weight: 600; }
  #opened .middle small { display: block; font-size: 3vh; font-weight: 400; margin-top: 2vh; }
</style>
</head>
<body>

<section id="welcome" class="screen active" aria-label="Welcome">
  <h1 id="hospitalName"></h1>
  <p>Entertainment, meals and your health record, all in one place.</p>
  <button class="start" type="button">Touch to start</button>
</section>

<section id="menu" class="screen" aria-label="Menu">
  <header>
    <h2>What would you like to do?</h2>
    <div class="clock" id="clock"></div>
  </header>
  <div class="tiles">
    <button class="tile" type="button" data-go="tv">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M9 3l3 3 3-3"/></svg>
      <span class="name">Watch TV</span><span class="hint">Live channels</span>
    </button>
    <button class="tile" type="button" data-go="food">
      <svg viewBox="0 0 24 24"><path d="M5 3v7a2 2 0 0 0 4 0V3M7 12v9M17 3c-2 2-3 4-3 7h3zM17 10v11"/></svg>
      <span class="name">Order food</span><span class="hint">Today's menu</span>
    </button>
    <button class="tile" type="button" data-go="games">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15.5 11.5h.01M18 13.5h.01"/></svg>
      <span class="name">Play games</span><span class="hint">Xbox Cloud Gaming</span>
    </button>
    <button class="tile" type="button" data-go="mychart">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M8 12h2l1-2 2 4 1-2h2"/></svg>
      <span class="name">View MyChart</span><span class="hint">Results, care team, medications</span>
    </button>
  </div>
</section>

<section id="opened" class="screen" aria-label="Back to menu">
  <div class="edge">&#8592; Tap here to go back to the menu &#8594;</div>
  <div class="middle">Back to menu<small>Tap anywhere</small></div>
  <div class="edge">&#8592; Tap here to go back to the menu &#8594;</div>
</section>

<script>
  /* ------------ EDIT THESE ------------ */
  var CONFIG = {
    hospitalName: "Welcome to Texas Children's Hospital",
    tvUrl: 'tv.html',
    idleSeconds: 120   // menu returns to welcome after this
  };
  /* The addresses for food, games and MyChart now live in kiosk-home.js (SITES). */
  /* ------------------------------------ */

  var screens = document.querySelectorAll('.screen');
  var idleTimer = null;

  function show(id) {
    for (var i = 0; i < screens.length; i++) {
      screens[i].classList.toggle('active', screens[i].id === id);
    }
    clearTimeout(idleTimer);
    if (id === 'menu') {
      idleTimer = setTimeout(function () { show('welcome'); }, CONFIG.idleSeconds * 1000);
    }
  }

  function go(target) {
    if (target === 'tv') { location.href = CONFIG.tvUrl; return; }
    // The macro watches this page's address. Loading "?open=food" tells it to
    // open that site in a window on top; this page waits underneath.
    location.href = 'index.html?open=' + target + '&t=' + Date.now();
  }

  document.getElementById('hospitalName').textContent = CONFIG.hospitalName;
  document.getElementById('welcome').addEventListener('click', function () { show('menu'); });
  document.getElementById('opened').addEventListener('click', function () {
    location.href = 'index.html#menu';
  });

  var buttons = document.querySelectorAll('[data-go]');
  for (var b = 0; b < buttons.length; b++) {
    buttons[b].addEventListener('click', function (e) {
      e.stopPropagation();
      go(this.getAttribute('data-go'));
    });
  }

  // Any touch on the menu restarts the idle countdown.
  document.addEventListener('pointerdown', function () {
    var active = document.querySelector('.screen.active');
    if (active && active.id === 'menu') show('menu');
  });

  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  tick(); setInterval(tick, 15000);

  if (/[?&]open=/.test(location.search)) show('opened');
  else if (location.hash === '#menu') show('menu');
</script>
</body>
</html>
