<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch TV</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; user-select: none; }
  .wrap { display: flex; height: 100vh; }
  .stage { flex: 1; min-width: 0; position: relative; background: #000; }
  video { width: 100%; height: 100%; background: #000; }
  #now { position: absolute; left: 2vw; top: 2vh; font-size: 2.6vh; font-weight: 600;
    background: rgba(11,42,58,.8); padding: 1vh 1.2vw; border-radius: 1.2vh; }
  #now:empty { display: none; }
  aside { width: 24vw; background: #0b2a3a; padding: 2.5vh 1.2vw; display: flex; flex-direction: column; gap: 1.5vh; }
  button { font: inherit; font-size: 2.4vh; font-weight: 600; padding: 1.9vh 1vw; border-radius: 1.4vh;
    border: 0; background: #103a4f; color: #fff; cursor: pointer; text-align: left; }
  button:active { transform: scale(.98); }
  button.on { background: #14a38b; }
  button.home { background: #fff; color: #0b2a3a; text-align: center; }
  .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1vh; }
  .controls button { text-align: center; padding: 1.6vh 0; }
  .vol { display: flex; align-items: center; gap: 1vw; font-size: 2vh; color: #b9d3de; }
  .vol input { flex: 1; height: 4vh; accent-color: #14a38b; }
  #status { font-size: 2vh; color: #f3c56b; min-height: 2.6vh; }
  #channels { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 1.2vh;
    -webkit-overflow-scrolling: touch; padding-right: .4vw; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <video id="video" playsinline autoplay></video>
    <div id="now"></div>
  </div>
  <aside>
    <button class="home" type="button" id="home">Back to menu</button>
    <div class="controls">
      <button type="button" id="prev" aria-label="Previous channel">Ch &minus;</button>
      <button type="button" id="mute">Mute</button>
      <button type="button" id="next" aria-label="Next channel">Ch +</button>
    </div>
    <label class="vol">Volume <input id="volume" type="range" min="0" max="100" value="60"></label>
    <div id="status" role="status"></div>
    <div id="channels"></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
  /* ------------ EDIT THESE ------------ */
  var CONFIG = {
    // Same playlist the IPTV macro's "contentServer" setting pointed at.
    playlistUrl: 'https://iptv-org.github.io/iptv/categories/business.m3u',
    // Check each stream can be played in a web page before listing it
    // (the macro's "validateStreams" option). Slower to fill, fewer dead buttons.
    validateStreams: true,
    validateTimeoutMs: 6000,
    validateAtOnce: 6,
    // Optional fixed channels, listed first: { name: 'News', link: 'https://.../index.m3u8' }
    extraChannels: [],
    homeUrl: 'index.html#menu'
  };
  /* ------------------------------------ */

  var video  = document.getElementById('video');
  var list   = document.getElementById('channels');
  var status = document.getElementById('status');
  var now    = document.getElementById('now');
  var channels = [];
  var current = -1;
  var hls = null;

  /* Ported from the macro's convertM3u(): name is the text after the last
     comma on the #EXTINF line; the link is the next https line. http links
     are skipped because an https page is not allowed to load them. */
  function parseM3u(text) {
    var out = [];
    var lines = text.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace('\r', '');
      if (line.indexOf('#EXTINF') !== 0) continue;
      var name = line.split(',').pop().trim();
      for (var l = i + 1; l < lines.length; l++) {
        var next = lines[l].replace('\r', '').trim();
        if (next.indexOf('https:') === 0) { out.push({ name: name, link: next }); break; }
        if (next.indexOf('http:') === 0 || next.indexOf('#EXTINF') === 0) break;
      }
    }
    return out;
  }

  /* Browser version of the macro's checkCORs(): if the page is allowed to
     fetch the manifest, the player will be allowed to as well. */
  function canPlay(link) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, CONFIG.validateTimeoutMs);
    return fetch(link, { mode: 'cors', signal: ctrl.signal })
      .then(function (r) { return r.ok; })
      .catch(function () { return false; })
      .then(function (ok) { clearTimeout(timer); return ok; });
  }

  function addChannel(ch) {
    var index = channels.push(ch) - 1;
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = ch.name;
    b.addEventListener('click', function () { play(index); });
    list.appendChild(b);
    if (current === -1) play(0);
  }

  function play(index) {
    if (!channels.length) return;
    current = (index + channels.length) % channels.length;
    var ch = channels[current];
    var btns = list.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', i === current);
    if (btns[current]) btns[current].scrollIntoView({ block: 'nearest' });
    now.textContent = ch.name;

    if (hls) { hls.destroy(); hls = null; }
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.on(Hls.Events.ERROR, function (evt, data) {
        if (data.fatal) now.textContent = ch.name + ' is not available right now';
      });
      hls.loadSource(ch.link);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = ch.link;
    } else {
      status.textContent = 'Video playback is not supported on this device.';
      return;
    }
    var p = video.play();
    if (p && p.catch) p.catch(function () { status.textContent = 'Tap a channel to start.'; });
  }

  function loadChannels() {
    CONFIG.extraChannels.forEach(addChannel);
    status.textContent = 'Loading channel list…';
    fetch(CONFIG.playlistUrl)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (text) {
        var found = parseM3u(text);
        if (!CONFIG.validateStreams) { found.forEach(addChannel); status.textContent = ''; return; }

        var nextIndex = 0, done = 0;
        function worker() {
          if (nextIndex >= found.length) return Promise.resolve();
          var ch = found[nextIndex++];
          return canPlay(ch.link).then(function (ok) {
            if (ok) addChannel(ch);
            done++;
            status.textContent = done < found.length
              ? 'Checking channels ' + done + ' of ' + found.length
              : (channels.length ? '' : 'No channels are available right now.');
            return worker();
          });
        }
        var workers = [];
        for (var w = 0; w < CONFIG.validateAtOnce; w++) workers.push(worker());
        return Promise.all(workers);
      })
      .catch(function () {
        status.textContent = channels.length ? '' : 'The channel list could not be loaded.';
      });
  }

  document.getElementById('home').addEventListener('click', function () { location.href = CONFIG.homeUrl; });
  document.getElementById('prev').addEventListener('click', function () { play(current - 1); });
  document.getElementById('next').addEventListener('click', function () { play(current + 1); });

  var muteBtn = document.getElementById('mute');
  var volume = document.getElementById('volume');
  muteBtn.addEventListener('click', function () {
    video.muted = !video.muted;
    muteBtn.classList.toggle('on', video.muted);
    muteBtn.textContent = video.muted ? 'Unmute' : 'Mute';
  });
  volume.addEventListener('input', function () { video.volume = volume.value / 100; });
  video.volume = volume.value / 100;

  loadChannels();
</script>
</body>
</html>
